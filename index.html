<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1a10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-512.png" />
  <title>Medieval Match</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b1a10; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #6b3a1c 0%, #2b1a10 70%); color: #ffe39a; font: 700 22px system-ui, sans-serif; z-index: 10; transition: opacity .45s; }
    #loader.hide { opacity: 0; pointer-events: none; }
    #loader img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: bob 1.6s ease-in-out infinite; }
    #loader .title { font-size: 40px; letter-spacing: 1px; color: #ffd84a; text-shadow: 0 3px 0 #4a1e05, 0 0 18px rgba(255,200,80,.35); }
    #loader .bar { width: 240px; height: 18px; border-radius: 10px; background: #3b2210; border: 3px solid #c89a3c; overflow: hidden; }
    #loader .fill { height: 100%; width: 0; background: linear-gradient(#8fe86a, #3fa02a); transition: width .2s; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="loader">
    <img src="./icon-512.png" alt="" />
    <div class="title">Medieval Match</div>
    <div class="bar"><div class="fill" id="loadfill"></div></div>
    <div id="loadtxt">Yükleniyor…</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
